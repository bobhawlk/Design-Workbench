[package]
name = "lcw-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "inv2sc: convert Inventor assemblies into clean, editable SolidCraft assemblies"

[[bin]]
name = "inv2sc"
path = "src/main.rs"

[dependencies]
lcw-json = { path = "../lcw-json" }
lcw-geom = { path = "../lcw-geom" }
lcw-step = { path = "../lcw-step" }
lcw-bundle = { path = "../lcw-bundle" }
lcw-analyze = { path = "../lcw-analyze" }
lcw-solidcraft = { path = "../lcw-solidcraft" }
lcw-verify = { path = "../lcw-verify" }

[lints]
workspace = true
